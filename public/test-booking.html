<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận đặt phòng - The Mansion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; padding: 16px; }
        .container { max-width: 480px; margin: 0 auto; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header { background: #1a365d; color: white; padding: 24px; text-align: center; }
        .header h1 { font-size: 20px; margin: 0; }
        .header p { margin: 8px 0 0; font-size: 13px; opacity: 0.9; }
        .section { padding: 20px; border-bottom: 1px solid #e5e7eb; }
        .section-title { margin: 0 0 16px; font-size: 12px; font-weight: 700; color: #6b7280; letter-spacing: 0.5px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .label { font-size: 14px; color: #6b7280; }
        .value { font-size: 14px; font-weight: 500; color: #111827; }
        .status-badge { padding: 4px 12px; border-radius: 20px; color: white; font-size: 12px; font-weight: 600; background: #3b82f6; }
        .bank-card { background: #f9fafb; border-radius: 12px; padding: 16px; }
        .bank-row { margin-bottom: 12px; }
        .bank-label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .bank-value { font-size: 15px; font-weight: 600; color: #111827; }
        .copy-btn { padding: 4px 10px; font-size: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; margin-left: 8px; }
        .transfer-box { background: #fffbeb; padding: 12px; border-radius: 8px; margin-top: 12px; }
        .footer { padding: 20px; text-align: center; font-size: 13px; color: #6b7280; }
        .loading { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .error { text-align: center; padding: 40px; color: #6b7280; }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Đang tải...</div>
    </div>
    <script>
        const API_URL = 'https://pms-api.minova.vn/api/v1/public/booking/7562/confirmation?branch_code=the_mansion';

        async function loadBooking() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (!response.ok || data.message) {
                    document.getElementById('app').innerHTML = '<div class="error"><h2>Không tìm thấy đặt phòng</h2><p>' + (data.message || 'Vui lòng kiểm tra lại mã đặt phòng') + '</p></div>';
                    return;
                }

                const { reservation, property, bank_transfer } = data;

                document.getElementById('app').innerHTML = `
                    <div class="container">
                        <div class="header">
                            <h1>${property.name}</h1>
                            <p>${property.address || 'Đà Nẵng'}</p>
                        </div>
                        <div class="section">
                            <span class="status-badge">${reservation.status === 'reserved' ? 'Chờ nhận phòng' : reservation.status}</span>
                        </div>
                        <div class="section">
                            <h3 class="section-title">THÔNG TIN PHÒNG</h3>
                            <div class="info-row"><span class="label">Loại phòng:</span><span class="value">${reservation.room_type}</span></div>
                            <div class="info-row"><span class="label">Số phòng:</span><span class="value">${reservation.room_number}</span></div>
                            <div class="info-row"><span class="label">Ngày nhận phòng:</span><span class="value">${reservation.checkin}</span></div>
                            <div class="info-row"><span class="label">Ngày trả phòng:</span><span class="value">${reservation.checkout}</span></div>
                            <div class="info-row"><span class="label">Số đêm:</span><span class="value">${reservation.nights} đêm</span></div>
                        </div>
                        <div class="section">
                            <h3 class="section-title">THANH TOÁN</h3>
                            <div class="info-row"><span class="label">Tổng tiền:</span><span class="value">${new Intl.NumberFormat('vi-VN', {style:'currency',currency:'VND'}).format(reservation.total_amount)}</span></div>
                            <div class="info-row"><span class="label">Đã cọc:</span><span class="value">${new Intl.NumberFormat('vi-VN', {style:'currency',currency:'VND'}).format(reservation.deposit_amount)}</span></div>
                            <div class="info-row" style="border-top:1px dashed #ddd;padding-top:8px;margin-top:8px">
                                <span class="label" style="font-weight:600">Còn lại:</span>
                                <span class="value" style="color:#dc2626;font-weight:700">${new Intl.NumberFormat('vi-VN', {style:'currency',currency:'VND'}).format(reservation.remaining_amount)}</span>
                            </div>
                        </div>
                        ${bank_transfer ? `
                        <div class="section">
                            <h3 class="section-title">CHUYỂN KHOẢN</h3>
                            <div class="bank-card">
                                <div class="bank-row">
                                    <span class="bank-label">Ngân hàng:</span>
                                    <span class="bank-value">${bank_transfer.bank_name}</span>
                                </div>
                                <div class="bank-row">
                                    <span class="bank-label">Số tài khoản:</span>
                                    <span class="bank-value">${bank_transfer.account_number}</span>
                                </div>
                                <div class="bank-row">
                                    <span class="bank-label">Chủ tài khoản:</span>
                                    <span class="bank-value">${bank_transfer.account_holder}</span>
                                </div>
                                <div class="transfer-box">
                                    <span class="bank-label">Nội dung chuyển khoản:</span>
                                    <span class="bank-value" style="color:#b45309">${bank_transfer.transfer_content}</span>
                                </div>
                            </div>
                        </div>
                        ` : ''}
                        <div class="footer">
                            <p>Cảm ơn quý khách đã lựa chọn ${property.name}!</p>
                        </div>
                    </div>
                `;
            } catch (err) {
                document.getElementById('app').innerHTML = '<div class="error"><h2>Lỗi</h2><p>' + err.message + '</p></div>';
            }
        }
        loadBooking();
    </script>
</body>
</html>
